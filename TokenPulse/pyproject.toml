[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-pulse"
version = "0.1.1"
description = "Local, read-only Codex output-speed monitoring for Windows and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
keywords = ["codex", "tokens-per-second", "system-tray", "local-first", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.gui-scripts]
token-pulse = "token_pulse.__main__:main"

[project.scripts]
token-pulse-cli = "token_pulse.__main__:main"

[project.urls]
Repository = "https://github.com/zzccchen/token-pulse"
Documentation = "https://github.com/zzccchen/token-pulse#readme"
Issues = "https://github.com/zzccchen/token-pulse/issues"
Changelog = "https://github.com/zzccchen/token-pulse/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
packaging = [
    "pyinstaller>=6.16,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/token_pulse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/.github", "/.gitattributes", "/.gitignore",
    "/AGENTS.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md",
    "/README.zh-CN.md", "/ROADMAP.md", "/SECURITY.md", "/THIRD_PARTY.md",
    "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"
