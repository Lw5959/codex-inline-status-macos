name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Build native App
        run: make build
      - name: Run JavaScript and legacy Python regressions
        run: make test
      - name: Check synthetic UI overhead
        run: make benchmark
      - name: Build and verify DMG
        run: make dmg
      - name: Generate release checksums
        working-directory: outputs
        run: shasum -a256 GPT-Launcher-*.dmg GPT-Launcher-*.zip > SHA256SUMS
      - name: Save verified release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-${{ github.sha }}
          path: |
            outputs/*.dmg
            outputs/*.zip
            outputs/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
